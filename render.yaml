# Render blueprint for the Spring Boot API.
# The Vue client can live on Vercel; this file only publishes the backend.
services:
  - type: web
    name: campus-venue-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/venues
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      # Point this at a managed MySQL instance. Render's own disks need a paid plan,
      # so the free path is a hosted MySQL such as Aiven, PlanetScale or Railway.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
