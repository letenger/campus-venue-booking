<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1170" viewBox="0 0 1300 1170" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6b82"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/></marker>
<marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e9384"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d1435f"/></marker>
<marker id="dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="5" markerHeight="5"><circle cx="3" cy="3" r="2.6" fill="#c9d4e3"/></marker>
</defs>
<rect width="1300" height="1170" fill="#ffffff"/>
<text x="44" y="58" font-size="25" font-weight="700" fill="#16202e" text-anchor="start" letter-spacing="-0.3">Figure 4 — Booking request flow</text>
<text x="44" y="84" font-size="13.5" font-weight="400" fill="#5b6b82" text-anchor="start">One request, four checks, two ways out. Rejection and conflict are decided before anything is written.</text>
<rect x="415" y="96" width="350" height="54" rx="27.0" fill="#2f6fed" stroke="sees the weekly timetable and the free slots" stroke-width="1.4"/>
<text x="590.0" y="127.5" font-size="#ffffff" font-weight="700" fill="#16202e" text-anchor="middle">Student picks a venue</text>
<path d="M 590.0 150.0 L 590.0 186.0" fill="none" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#arb)"/>
<rect x="400.0" y="186" width="380" height="66" rx="9" fill="#ffffff" stroke="#2f6fed" stroke-width="1.3"/>
<text x="418.0" y="214" font-size="13" font-weight="600" fill="#16202e" text-anchor="start">POST /api/bookings</text>
<text x="418.0" y="234" font-size="11" font-weight="400" fill="#5b6b82" text-anchor="start">venue · date · start · end · purpose · head count</text>
<path d="M 590.0 252.0 L 590.0 276.0" fill="none" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#arb)"/>
<polygon points="590,276.0 770.0,330 590,384.0 410.0,330" fill="#fdf3e4" stroke="#c2761a" stroke-width="1.4"/>
<text x="590" y="326" font-size="12.5" font-weight="600" fill="#16202e" text-anchor="middle">Venue open and slot</text>
<text x="590" y="342" font-size="12.5" font-weight="600" fill="#16202e" text-anchor="middle">inside opening hours?</text>
<path d="M 590.0 384.0 L 590.0 412.0" fill="none" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#arb)"/>
<text x="598" y="404" font-size="10.5" font-weight="600" fill="#0e9384" text-anchor="start">yes</text>
<path d="M 410.0 330.0 L 384.0 330.0" fill="none" stroke="#d1435f" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="422" y="320" font-size="10.5" font-weight="600" fill="#d1435f" text-anchor="start">no</text>
<rect x="40" y="304" width="340" height="52" rx="9" fill="#fdeef1" stroke="#d1435f" stroke-width="1.3"/>
<text x="56" y="328" font-size="12.5" font-weight="700" fill="#d1435f" text-anchor="start">400 Bad Request</text>
<text x="56" y="346" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">venue closed, or the slot is outside hours</text>
<polygon points="590,412.0 770.0,466 590,520.0 410.0,466" fill="#fdf3e4" stroke="#c2761a" stroke-width="1.4"/>
<text x="590" y="462" font-size="12.5" font-weight="600" fill="#16202e" text-anchor="middle">Slot already taken by an</text>
<text x="590" y="478" font-size="12.5" font-weight="600" fill="#16202e" text-anchor="middle">active booking?</text>
<path d="M 590.0 520.0 L 590.0 548.0" fill="none" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#arb)"/>
<text x="598" y="540" font-size="10.5" font-weight="600" fill="#0e9384" text-anchor="start">no</text>
<path d="M 410.0 466.0 L 384.0 466.0" fill="none" stroke="#d1435f" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="422" y="456" font-size="10.5" font-weight="600" fill="#d1435f" text-anchor="start">yes</text>
<rect x="40" y="440" width="340" height="52" rx="9" fill="#fdeef1" stroke="#d1435f" stroke-width="1.3"/>
<text x="56" y="464" font-size="12.5" font-weight="700" fill="#d1435f" text-anchor="start">409 Conflict</text>
<text x="56" y="482" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">PENDING and APPROVED both block the slot</text>
<polygon points="590,544.0 780.0,602 590,660.0 400.0,602" fill="#fdf3e4" stroke="#c2761a" stroke-width="1.4"/>
<text x="590" y="598" font-size="12.5" font-weight="600" fill="#16202e" text-anchor="middle">Club, class, event, exam</text>
<text x="590" y="614" font-size="12.5" font-weight="600" fill="#16202e" text-anchor="middle">or 10+ people?</text>
<path d="M 590.0 660.0 L 590.0 690.0" fill="none" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#arb)"/>
<text x="598" y="682" font-size="10.5" font-weight="600" fill="#0e9384" text-anchor="start">no</text>
<path d="M 780.0 602.0 L 820.0 602.0" fill="none" stroke="#c2761a" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="792" y="592" font-size="10.5" font-weight="600" fill="#c2761a" text-anchor="start">yes</text>
<rect x="400.0" y="690" width="380" height="66" rx="9" fill="#ffffff" stroke="#0e9384" stroke-width="1.3"/>
<text x="418.0" y="718" font-size="13" font-weight="600" fill="#16202e" text-anchor="start">APPROVED right away</text>
<text x="418.0" y="738" font-size="11" font-weight="400" fill="#5b6b82" text-anchor="start">approvedAt = now, approver = the student</text>
<path d="M 590.0 740.0 L 590.0 768.0" fill="none" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#arb)"/>
<rect x="820" y="572" width="340" height="50" rx="9" fill="#fdf3e4" stroke="#c2761a" stroke-width="1.3"/>
<text x="990.0" y="602" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">PENDING · every teacher notified</text>
<path d="M 990.0 622.0 L 990.0 654.0" fill="none" stroke="#c2761a" stroke-width="1.5" marker-end="url(#ar)"/>
<polygon points="990.0,654.0 1130.0,706 990.0,758.0 850.0,706" fill="#fdf3e4" stroke="#c2761a" stroke-width="1.4"/>
<text x="990.0" y="702" font-size="12.5" font-weight="600" fill="#16202e" text-anchor="middle">Teacher decision</text>
<text x="990.0" y="718" font-size="12.5" font-weight="600" fill="#16202e" text-anchor="middle">in the approvals list?</text>
<path d="M 850.0 706.0 L 810.0 706.0 Q 796.0 706.0 796.0 720.0 L 796.0 737.0 Q 796.0 745.0 788.0 745.0 L 780.0 745.0" fill="none" stroke="#0e9384" stroke-width="1.5" marker-end="url(#art)"/>
<text x="824" y="722" font-size="10.5" font-weight="600" fill="#0e9384" text-anchor="start">approve</text>
<path d="M 990.0 758.0 L 990.0 790.0" fill="none" stroke="#d1435f" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="1000.0" y="780" font-size="10.5" font-weight="600" fill="#d1435f" text-anchor="start">reject</text>
<rect x="820" y="790" width="340" height="52" rx="9" fill="#fdeef1" stroke="#d1435f" stroke-width="1.3"/>
<text x="836" y="814" font-size="12.5" font-weight="700" fill="#d1435f" text-anchor="start">REJECTED</text>
<text x="836" y="832" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">reason is required, the student sees it</text>
<rect x="400.0" y="768" width="380" height="66" rx="9" fill="#ffffff" stroke="#0e9384" stroke-width="1.3"/>
<text x="418.0" y="796" font-size="13" font-weight="600" fill="#16202e" text-anchor="start">Booking is live</text>
<text x="418.0" y="816" font-size="11" font-weight="400" fill="#5b6b82" text-anchor="start">student sees it in My bookings</text>
<path d="M 590.0 818.0 L 590.0 846.0" fill="none" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#arb)"/>
<rect x="400.0" y="846" width="380" height="66" rx="9" fill="#ffffff" stroke="#2f6fed" stroke-width="1.3"/>
<text x="418.0" y="874" font-size="13" font-weight="600" fill="#16202e" text-anchor="start">Student arrives, staff checks in</text>
<text x="418.0" y="894" font-size="11" font-weight="400" fill="#5b6b82" text-anchor="start">checkInAt = now</text>
<path d="M 590.0 912.0 L 590.0 940.0" fill="none" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#arb)"/>
<polygon points="590,940.0 780.0,996 590,1052.0 400.0,996" fill="#fdf3e4" stroke="#c2761a" stroke-width="1.4"/>
<text x="590" y="992" font-size="12.5" font-weight="600" fill="#16202e" text-anchor="middle">Checked in before</text>
<text x="590" y="1008" font-size="12.5" font-weight="600" fill="#16202e" text-anchor="middle">the slot ends?</text>
<path d="M 590.0 1052.0 L 590.0 1078.0" fill="none" stroke="#0e9384" stroke-width="1.6" marker-end="url(#art)"/>
<text x="598" y="1072" font-size="10.5" font-weight="600" fill="#0e9384" text-anchor="start">yes</text>
<path d="M 780.0 996.0 L 820.0 996.0" fill="none" stroke="#d1435f" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="792" y="986" font-size="10.5" font-weight="600" fill="#d1435f" text-anchor="start">no</text>
<rect x="440" y="1072" width="300" height="48" rx="24.0" fill="#0e9384" stroke="None" stroke-width="1.4"/>
<text x="590.0" y="1100.5" font-size="#e8f7f5" font-weight="700" fill="#16202e" text-anchor="middle">COMPLETED</text>
<rect x="820" y="966" width="340" height="60" rx="9" fill="#fdeef1" stroke="#d1435f" stroke-width="1.3"/>
<text x="836" y="990" font-size="12.5" font-weight="700" fill="#d1435f" text-anchor="start">NO_SHOW</text>
<text x="836" y="1009" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">nightly @Scheduled sweep closes it</text>
<path d="M 400.0 726.0 L 384.0 726.0" fill="none" stroke="#5b6b82" stroke-width="1.4" marker-end="url(#ar)" stroke-dasharray="4 4"/>
<text x="394" y="744" font-size="10" font-weight="600" fill="#5b6b82" text-anchor="end">cancel</text>
<rect x="40" y="674" width="340" height="52" rx="9" fill="#fdeef1" stroke="#d1435f" stroke-width="1.3"/>
<text x="56" y="698" font-size="12.5" font-weight="700" fill="#d1435f" text-anchor="start">CANCELLED</text>
<text x="56" y="716" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">allowed while PENDING or APPROVED</text>
<text x="40" y="1140" font-size="12" font-weight="400" fill="#8b98ab" text-anchor="start">Nothing is written until all three checks pass, so a conflict never leaves a half-made booking behind.</text>
</svg>
