<text x="60" y="138" font-size="10.5" font-weight="700" fill="#2f6fed" text-anchor="start" letter-spacing="1.2">CLIENT · BROWSER</text>
<rect x="60" y="152" width="253" height="70" rx="9" fill="#ffffff" stroke="#2f6fed" stroke-width="1.3"/>
<text x="186.5" y="183.0" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">Vue 3 SPA</text>
<text x="186.5" y="201.0" font-size="11" font-weight="400" fill="#5b6b82" text-anchor="middle">views + Element Plus</text>
<rect x="333" y="152" width="253" height="70" rx="9" fill="#ffffff" stroke="#2f6fed" stroke-width="1.3"/>
<text x="459.5" y="183.0" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">Vue Router</text>
<text x="459.5" y="201.0" font-size="11" font-weight="400" fill="#5b6b82" text-anchor="middle">role guards per route</text>
<rect x="606" y="152" width="253" height="70" rx="9" fill="#ffffff" stroke="#2f6fed" stroke-width="1.3"/>
<text x="732.5" y="183.0" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">Axios client</text>
<text x="732.5" y="201.0" font-size="11" font-weight="400" fill="#5b6b82" text-anchor="middle">adds Bearer token</text>
<rect x="40" y="270" width="840" height="166" rx="14" fill="#f7f9fc" stroke="#c9d4e3" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="60" y="296" font-size="10.5" font-weight="700" fill="#2f6fed" text-anchor="start" letter-spacing="1.2">API · SPRING MVC</text>
