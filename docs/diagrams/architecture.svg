<text x="472" y="629.0" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">query</text>
<text x="900" y="96" font-size="10.5" font-weight="700" fill="#d1435f" text-anchor="start" letter-spacing="1.2">CROSS-CUTTING</text>
<rect x="900" y="112" width="220" height="128" rx="10" fill="#ffffff" stroke="#d1435f" stroke-width="1.2"/>
<text x="916" y="138" font-size="12.5" font-weight="700" fill="#16202e" text-anchor="start">JwtService</text>
<text x="916" y="158" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">HS256 sign / verify</text>
<text x="916" y="174" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">hand-rolled, no lib</text>
<path d="M 898.0 176.0 L 886.0 176.0" fill="none" stroke="#d1435f" stroke-width="1.1" marker-end="url(#arr)" stroke-dasharray="3 3"/>
<rect x="900" y="258" width="220" height="104" rx="10" fill="#ffffff" stroke="#d1435f" stroke-width="1.2"/>
<text x="916" y="284" font-size="12.5" font-weight="700" fill="#16202e" text-anchor="start">Scheduler</text>
<text x="916" y="304" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">@Scheduled sweep</text>
<text x="916" y="320" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">closes stale bookings</text>
<path d="M 898.0 310.0 L 886.0 310.0" fill="none" stroke="#d1435f" stroke-width="1.1" marker-end="url(#arr)" stroke-dasharray="3 3"/>
<rect x="900" y="380" width="220" height="118" rx="10" fill="#ffffff" stroke="#d1435f" stroke-width="1.2"/>
<text x="916" y="406" font-size="12.5" font-weight="700" fill="#16202e" text-anchor="start">AuditService</text>
<text x="916" y="426" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">append-only trail</text>
<text x="916" y="442" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">actor · action · target</text>
<path d="M 898.0 439.0 L 886.0 439.0" fill="none" stroke="#d1435f" stroke-width="1.1" marker-end="url(#arr)" stroke-dasharray="3 3"/>
<rect x="900" y="516" width="220" height="118" rx="10" fill="#ffffff" stroke="#d1435f" stroke-width="1.2"/>
<text x="916" y="542" font-size="12.5" font-weight="700" fill="#16202e" text-anchor="start">Exception handler</text>
<text x="916" y="562" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">one error envelope</text>
<text x="916" y="578" font-size="10.5" font-weight="400" fill="#5b6b82" text-anchor="start">for every failure</text>
<path d="M 898.0 575.0 L 886.0 575.0" fill="none" stroke="#d1435f" stroke-width="1.1" marker-end="url(#arr)" stroke-dasharray="3 3"/>
<text x="44" y="800" font-size="12" font-weight="400" fill="#8b98ab" text-anchor="start">Requests only move downward. Notifications and audit writes are side effects of a service call, so the API layer never holds business state.</text>
</svg>
