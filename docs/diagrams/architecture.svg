<text x="178.0" y="699.0" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">Spring Data JPA</text>
<text x="178.0" y="717.0" font-size="11" font-weight="400" fill="#5b6b82" text-anchor="middle">one repository per aggregate</text>
<rect x="348" y="674" width="176" height="58" rx="9" fill="#ffffff" stroke="#0e9384" stroke-width="1.3"/>
<text x="436.0" y="699.0" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">Hibernate</text>
<text x="436.0" y="717.0" font-size="11" font-weight="400" fill="#5b6b82" text-anchor="middle">entity mapping</text>
<rect x="576" y="674" width="283" height="58" rx="9" fill="#ffffff" stroke="#0e9384" stroke-width="1.3"/>
<text x="717.5" y="699.0" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">H2 (dev) / MySQL 8 (prod)</text>
<text x="717.5" y="717.0" font-size="11" font-weight="400" fill="#5b6b82" text-anchor="middle">same schema, profile switch</text>
