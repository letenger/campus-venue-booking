<rect width="1160" height="830" fill="#ffffff"/>
<text x="44" y="58" font-size="25" font-weight="700" fill="#16202e" text-anchor="start" letter-spacing="-0.3">Figure 2 — System architecture</text>
<text x="44" y="84" font-size="13.5" font-weight="400" fill="#5b6b82" text-anchor="start">Four layers, one request path. Everything crossing a layer boundary goes through a DTO.</text>
