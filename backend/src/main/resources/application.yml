server:
  port: 8080

spring:
  application:
    name: campus-venue-booking

  # Dev profile: in-memory H2, schema recreated on every start.
  datasource:
    url: jdbc:h2:mem:campus;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Replace this before running anywhere that is not a laptop.
    secret: "dev-only-secret-please-replace-0123456789abcdef"
    expiry-minutes: 1440
  cors:
    allowed-origins: "http://localhost:5173"

logging:
  level:
    com.campus.venue: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_venue?useSSL=false&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:campus}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
